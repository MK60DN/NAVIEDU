# ============================================================================
# Tender v2.0 — Embracing Heterogeneity
# 全局配置文件
#
# 本文件定义了从数据输入到策略输出的全链路参数。
# 所有模块均支持通过此文件动态切换引擎。
# ============================================================================

# ============================================================================
# 通用设置
# ============================================================================
general:
  project_name: "tender_analysis"
  version: "2.0.0"
  log_level: "INFO"                    # DEBUG | INFO | WARNING | ERROR
  log_file: "logs/tender.log"
  random_seed: 42
  device: "cpu"                        # cpu | cuda | mps

# ============================================================================
# 情绪向量化模块配置
# ============================================================================
emotion_vectorizer:
  engine: "neuro_symbolic"            # neuro_symbolic | multimodal
  model_name: "gpt-4o-mini"           # LLM 模型名称（神经符号引擎使用）
  api_url: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"        # 从环境变量读取，不硬编码
  api_key_file: "config/local.yaml"   # 本地密钥文件（.gitignore 忽略）
  temperature: 0.1                    # LLM 温度参数
  batch_size: 16                      # 批处理大小
  # 符号规则权重（神经符号引擎使用）
  symbol_rule_weights:
    default: 0.3
    praise: 0.8
    complaint: 0.7
    question: 0.5
    confusion: 0.6
    agreement: 0.4
    disagreement: 0.6
    joke: 0.3
    instruction: 0.5
    greeting: 0.2
    topic_shift: 0.4
  # 因果链构建（用于因果分析模块的时间序列生成）
  build_causal_chain: false
  # 多模态参数（多模态引擎使用）
  multimodal:
    text_weight: 0.5
    behavior_weight: 0.3
    social_weight: 0.2

# ============================================================================
# 空间拓扑分析模块配置
# ============================================================================
topology_analysis:
  engine: "persistent_laplacian"      # persistent_laplacian | topological_gradient_flow
  # 通用参数
  normalize: true                     # 是否对输入向量归一化
  random_state: 42
  # 持续拉普拉斯算子参数
  laplacian_type: "combinatorial"     # combinatorial | normalized | random_walk
  spectral_gap_threshold: 0.1         # 谱隙阈值，用于判定显著簇的数量
  # 谱聚类参数
  n_eigenvectors: 10                  # 用于谱聚类的前 n 个特征向量
  # HDBSCAN 聚类参数
  hdbscan:
    min_cluster_size: 3
    min_samples: 2
    cluster_selection_epsilon: 0.5
  # 拓扑梯度流参数
  gradient_flow:
    step_size: 0.1
    max_iterations: 50
    convergence_threshold: 0.001

# ============================================================================
# 时间因果分析模块配置
# ============================================================================
causal_analysis:
  engine: "convergent_cross_mapping"  # convergent_cross_mapping | structural_causal_model | pc_lingam
  # 通用参数
  embedding_dimension: 3              # 嵌入维度 E (Takens 定理)
  time_delay: 1                       # 时间延迟 tau
  significance_level: 0.05
  # 收敛交叉映射参数
  ccm:
    library_size_ratio: 0.8           # 库大小比例（用于收敛测试）
    n_surrogates: 100                 # 替代数据数量（显著性检验）
  # 结构因果模型参数
  scm:
    causal_mechanism: "lingam"        # lingam | nonlinear
    intervention_enabled: true        # 是否启用 do-操作干预模拟
  # PC + LiNGAM 参数
  pc_lingam:
    independence_test: "fisherz"      # fisherz | gsquared | kci
    alpha: 0.05

# ============================================================================
# 时空融合模块配置
# ============================================================================
fusion:
  engine: "dct_gnn"                   # dct_gnn | neural_temporal_logic
  # 通用参数
  emotion_dim: 16                     # 情绪特征维度
  topology_dim: 16                    # 拓扑特征维度
  causal_dim: 16                      # 因果特征维度
  output_dim: 32                      # 融合输出维度
  # DCT-GNN 参数
  gnn:
    gcn_hidden_dims: [64, 32]         # GCN 隐藏层维度
    gcn_dropout: 0.2
    gru_hidden_dim: 32
    gru_num_layers: 2
    learning_rate: 0.001
    n_epochs: 100
    forecast_horizon: 1               # 预测下一个窗口的数量
  # 神经时序逻辑参数
  neural_tl:
    n_rules: 12                       # 内置规则数量
    temperature: 1.0                  # 规则评估温度（软/硬逻辑切换）
    activation_threshold: 0.5         # 规则激活阈值

# ============================================================================
# 认知状态分析模块配置
# ============================================================================
cognition:
  engine: "hybrid_state"              # knowledge_state | behavior_state | hybrid_state | neural_state
  # 通用参数
  feature_dim: 16
  # 知识状态分析器参数
  knowledge_state:
    vocabulary_diversity_weight: 0.3
    long_word_ratio_weight: 0.2
    question_density_weight: 0.5
  # 行为状态分析器参数
  behavior_state:
    participation_weight: 0.4
    response_time_weight: 0.3
    message_length_weight: 0.3
  # 混合状态分析器参数
  hybrid_state:
    nlp_weight: 0.4
    behavior_weight: 0.3
    knowledge_graph_weight: 0.3
    use_knowledge_graph: true         # 是否加载知识图谱
    knowledge_graph_path: "data/knowledge_graph.yaml"  # 知识图谱文件路径
  # 神经状态分析器参数
  neural_state:
    model_path: ""                    # 预训练模型路径（空表示使用统计启发式）
    mode: "heuristic"                 # pretrained | heuristic
    model_type: "lstm"                # lstm | transformer
    hidden_dim: 64
    n_layers: 2

# ============================================================================
# 情绪-认知协同模块配置
# ============================================================================
synergy:
  engine: "layered_reasoning"         # weighted_fusion | gated_fusion | layered_reasoning | causal_coordination
  # 通用参数
  emotion_dim: 16
  cognition_dim: 16
  output_dim: 32
  cognition_source: "internal"        # internal | external（是否使用外部认知模块）
  # 加权融合参数
  weighted_fusion:
    emotion_weight: 0.5
    cognition_weight: 0.5
  # 门控融合参数
  gated_fusion:
    gate_hidden_dim: 16
    gate_activation: "sigmoid"        # sigmoid | softmax
  # 分层推理参数
  layered_reasoning:
    priority: "cognition_first"       # cognition_first | emotion_first
    # 情绪-认知适应度阈值
    adaptation_thresholds:
      valence: 0.3
      arousal: 0.3
      focus: 0.2
  # 因果协调参数
  causal_coordination:
    causal_method: "ccm"              # ccm | granger | pearson
    causal_lag: 1
    max_emotion_features: 5
    max_cognition_features: 5

# ============================================================================
# 策略推理模块配置
# ============================================================================
strategy:
  engine: "causal_rl"                 # causal_rl | llm_strategist
  # 通用参数
  state_dim: 16                       # 状态空间维度（由融合输出维度决定）
  action_dim: 7                       # 动作空间维度（7种预定义策略）
  # 因果强化学习参数
  causal_rl:
    learning_rate: 0.001
    gamma: 0.99                       # 折扣因子
    epsilon_start: 1.0                # 探索率初始值
    epsilon_end: 0.01                 # 探索率终值
    epsilon_decay: 0.995
    buffer_size: 10000                # 经验回放池大小
    batch_size: 64
    target_update_freq: 100           # 目标网络更新频率
    use_double_q: true                # 是否使用双 Q 学习
    tau: 0.005                        # 目标网络软更新系数
  # LLM 策略器参数
  llm_strategist:
    model_name: "gpt-4o"
    fallback_strategy: "medium_risk"  # LLM 调用失败时的默认策略
  # 异质性协调层配置（原共识化过滤层）
  heterogeneity_coordination:
    enabled: true
    # 协调策略参数
    min_consensus: 0.3                # 最低共识度（低于此值启用异质性协调）
    max_retries: 3                    # 最大重试次数
    conflict_resolution: "adaptive"   # fixed_weight | adaptive | majority_vote
    # 并行策略最大分支数
    max_parallel_strategies: 5

# ============================================================================
# 🆕 群体异质性分析模块配置
# ============================================================================
heterogeneity:
  enabled: true                       # 是否启用异质性分析
  # 拓扑脱离分析参数
  topology_disconnect:
    space_weight: 0.4                 # 空间脱离权重
    causal_weight: 0.3                # 因果脱离权重
    cognition_weight: 0.3             # 认知脱离权重
    outlier_threshold: 0.7            # 脱离度阈值（高于此值标识为离群者）
  # 环状矛盾检测参数
  loop_detection:
    persistence_threshold: 0.5        # H1 持久性阈值
  # 因果网络碎片化参数
  causal_fragmentation:
    component_threshold: 2            # 碎片化判定阈值（组件数）
  # 行为异步分析参数
  temporal_asynchrony:
    window_size_hours: 24             # 行为分析时间窗口
  # 语言离散度分析参数
  linguistic_divergence:
    n_top_words: 100                  # 分析用词数量
  # 离群者类型分类参数
  isolate_classification:
    confidence_threshold: 0.6         # 类型判定置信度阈值

# ============================================================================
# 🆕 个人-群体不匹配检测模块配置
# ============================================================================
mismatch:
  enabled: true                       # 是否启用不匹配检测
  # 拓扑不匹配参数
  topological_mismatch:
    distance_metric: "bottleneck"     # bottleneck | wasserstein（持续图距离度量）
    significance_level: 0.05
  # 动态不匹配参数
  dynamic_mismatch:
    dtw_radius: 5                     # DTW 搜索半径
    use_multi_scale: true             # 是否使用多尺度分析
    scales: [1, 3, 5]                 # 时间尺度（秒/分钟/小时）
  # 个人独立性模型参数
  personal_independence:
    model_type: "hmm"                 # hmm | vae | arima
    self_consistency_threshold: 0.7   # 自洽性阈值
    wellbeing_threshold: 0.5          # 幸福感阈值（低于此值触发干预）

# ============================================================================
# 🆕 可视化模块配置
# ============================================================================
visualization:
  enabled: true
  output_format: "html"               # html | png | svg
  output_dir: "output/visualizations"
  # 情绪景观图
  emotion_landscape:
    colormap: "RdYlBu"
    point_size: 5
  # 拓扑结构图
  topology_plot:
    show_clusters: true
    show_loops: true
    show_outliers: true
  # 因果网络图
  causal_graph:
    layout: "spring"                  # spring | circular | kamada_kawai
    edge_width_multiplier: 5.0
  # 异质性散点图
  heterogeneity_plot:
    annotate_outlier_type: true       # 是否标注离群者类型
    color_by: "disconnect_type"       # disconnect_type | isolate_type
  # 不匹配距离矩阵热力图
  mismatch_plot:
    show_labels: true
    cluster_members: true             # 是否对成员进行聚类显示

# ============================================================================
# 数据路径配置
# ============================================================================
data:
  input_path: "data/input/"
  output_path: "data/output/"
  cache_path: "data/cache/"
  knowledge_graph_path: "data/knowledge_graph.yaml"
  # 时间窗口设置
  window_size: 60                     # 时间窗口大小（分钟）
  window_stride: 30                   # 窗口滑动步长（分钟）
