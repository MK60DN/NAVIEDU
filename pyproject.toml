[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tender"
version = "2.0.0"
description = "A Spatiotemporal Emotion-Cognition Dynamics Framework for Group Chat Analysis — Embracing Heterogeneity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Tender Contributors", email = "tender@example.com"},
]
keywords = [
    "emotion", "cognition", "synergy", "topological data analysis",
    "causal inference", "group dynamics", "heterogeneity", "mismatch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology :: Social Network Analysis",
]

# ============================================================================
# 核心依赖 (必须)
# ============================================================================
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.1",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "hdbscan>=0.8.33",
    "pypeln>=0.4.9",        # 🆕 管道并行处理
    "tqdm>=4.65.0",
    "jsonschema>=4.19.0",   # 🆕 配置验证
    "rich>=13.0.0",         # 🆕 终端格式化输出
]

# ============================================================================
# 可选依赖
# ============================================================================
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "sphinx>=7.0.0",           # 文档生成
    "sphinx-rtd-theme>=1.3.0",
]
deeplearning = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pytorch-lightning>=2.0.0",
    "torch-geometric>=2.4.0",
]
llm = [
    "openai>=1.0.0",
    "transformers>=4.35.0",
    "vllm>=0.2.0",
    "sentence-transformers>=2.2.0",
]
tda = [
    "ripser>=0.6.4",
    "persim>=0.3.0",
]
visualization = [
    "seaborn>=0.13.0",
    "pyvis>=0.3.0",
    "dash>=2.14.0",
    "dash-cytoscape>=0.3.0",
]

# ============================================================================
# 入口点 (命令行工具)
# ============================================================================
[project.scripts]
tender = "tender.cli:main"

# ============================================================================
# 打包配置
# ============================================================================
[tool.setuptools.packages.find]
where = ["src"]
include = ["tender*"]

[tool.setuptools.package-data]
"tender" = ["py.typed"]

# ============================================================================
# 测试配置
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/tender --cov-report=term-missing"

[tool.coverage.run]
source = ["src/tender"]
omit = ["*/tests/*", "*/__pycache__/*"]

# ============================================================================
# 代码风格配置
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

# ============================================================================
# 项目元数据
# ============================================================================
[tool.tender]
version = "2.0.0"
build_date = "2026-06-05"
